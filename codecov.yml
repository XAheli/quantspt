codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "80...100"
  status:
    project:
      default:
        target: 95%
        threshold: 2%
    patch:
      default:
        target: 95%

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: true
  require_base: true
  require_head: true

flag_management:
  default_rules:
    carryforward: true
    statuses:
      - type: project
        target: 95%
        threshold: 2%
      - type: patch
        target: 95%

flags:
  core:
    paths:
      - quantspt/core/
    carryforward: true
  models:
    paths:
      - quantspt/models/
    carryforward: true
  simulation:
    paths:
      - quantspt/simulation/
    carryforward: true
  optimization:
    paths:
      - quantspt/optimization/
    carryforward: true
  estimation:
    paths:
      - quantspt/estimation/
    carryforward: true
  data:
    paths:
      - quantspt/data/
    carryforward: true
